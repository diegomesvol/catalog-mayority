name: Supabase — aplicar migraciones

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      repair_version:
        description: "Solo para el arranque: versión ya corrida a mano en el SQL Editor (ej. 20260910000000)"
        required: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link al proyecto
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Marcar como aplicada una migración ya corrida a mano
        if: ${{ inputs.repair_version != '' }}
        run: supabase migration repair --status applied ${{ inputs.repair_version }}

      - name: Aplicar migraciones pendientes
        run: supabase db push
